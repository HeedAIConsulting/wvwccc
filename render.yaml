# West Valley · Warner Center Chamber of Commerce — production blueprint.
# POC stays on its own separate Render service; this is a NEW, independent service.

databases:
  - name: wvwccc-db
    plan: basic-256mb        # bump to standard as the roster + orders grow
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    # NOTE (Jul 29 2026): the LIVE Render service is named `wvwccc-web`
    # (wvwccc-web.onrender.com, fronted by woodlandhillscc.net via Cloudflare).
    # `wvwccc-production` does not resolve, so this blueprint is not what is
    # actually deployed — treat it as the spec, and set env vars marked
    # `sync: false` in the wvwccc-web dashboard by hand.
    name: wvwccc-production
    runtime: node
    plan: standard            # NOT free — public site cannot tolerate cold starts
    region: oregon
    # Dedicated repo (HeedAIConsulting/wvwccc): code is at the repo root, no rootDir.
    buildCommand: npm install
    preDeployCommand: npm run migrate    # apply backend/schema.sql before traffic flips
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wvwccc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong secret once
      # ── AI Concierge ──
      - key: GEMINI_API_KEY        # Heed key; always gemini-flash-latest
        sync: false
      - key: ANTHROPIC_API_KEY     # fallback, optional
        sync: false
      # ── Transactional email (payment receipts, password resets, notifications) ──
      # Without one of these providers, email silently no-ops (receipts skipped).
      # Resend is the chosen path: verify woodlandhillscc.net in Resend (DNS via
      # Cloudflare), then set both vars here. Office copies go to CHAMBER_NOTIFY
      # (defaults to felicia@woodlandhillscc.net in backend/email.js).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM            # e.g. West Valley · Warner Center Chamber <wendy@woodlandhillscc.net>
        sync: false
      # ── Payments: AGMS on the NMI gateway ──
      # LIVE merchant account `woodlandhillscc` (keys from Eduardo @ AGMS 2026-07-02,
      # screenshots in agms/ — gitignored). Set the private API key (Key ID 14789275)
      # in the Render dashboard; never commit it.
      - key: AGMS_SECURITY_KEY     # private API key, source API+Cart
        sync: false
      - key: AGMS_API_BASE         # prod: https://agms.transactiongateway.com | sandbox: https://sandbox.nmi.com
        sync: false
      - key: AGMS_USERNAME
        value: woodlandhillscc
      # ── Community Benefit Foundation: the SECOND processor ──
      # The Foundation is a separate 501(c)(3) with its own bank account, so its
      # donations, tickets and sponsorships must not settle into the Chamber's
      # operating account (Felicia, Sep 9 2026). AGMS adds a second processor
      # under this same gateway; set its id here and every Foundation charge
      # routes to it. Until it is set, those charges still go through but are
      # flagged `fundRouted:false` in the Pay Log and the office is emailed.
      - key: AGMS_PROCESSOR_ID_FOUNDATION
        sync: false
      # Only needed if the Chamber's own processor stops being the gateway
      # default. Blank = default processor, which is the long-standing behaviour.
      - key: AGMS_PROCESSOR_ID_CHAMBER
        sync: false
      # Set to 1 to REFUSE a Foundation payment rather than let it land in the
      # Chamber account while the processor above is missing. Off by default.
      - key: FOUNDATION_PAYMENTS_REQUIRE_ROUTING
        sync: false
      # ── Bot protection: Cloudflare Turnstile ──
      # SECRET key from the Cloudflare dashboard (Turnstile → the
      # woodlandhillscc.net widget → Settings). The matching SITE key is public
      # and lives in js/api-base.js.
      # IMPORTANT: backend/turnstile.js SKIPS verification entirely while this is
      # unset, so every public write endpoint (/api/contact, /api/public/job,
      # /api/public/event/verify) accepts unverified submissions until it is set.
      # The server logs a startup warning when it is missing in production.
      - key: TURNSTILE_SECRET
        sync: false
      # ── AI image creation (Admin → Tools) via Higgsfield ──
      # Create a key pair at platform.higgsfield.ai and set both here.
      # Without them, the Tools image creator shows a friendly "not configured".
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HIGGSFIELD_API_SECRET
        sync: false
