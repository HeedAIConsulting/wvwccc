<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/images/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate — West Valley · Warner Center Chamber of Commerce</title>
  <meta name="description" content="Support the West Valley · Warner Center Chamber's community programs — scholarships, festivals, Grateful Hearts, and neighborhood cleanups. Donations are tax-deductible." />
  <link rel="canonical" href="https://woodlandhillscc.net/donate.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/chamber.css?v=20260805b" />
</head>
<body>
  <div data-partial="header"></div>

  <section class="section-sm bg-forest">
    <div class="container">
      <span class="kicker">Give back</span>
      <h1 style="color:#fff">Support the West Valley</h1>
      <p class="lead" style="color:rgba(255,255,255,.85);max-width:62ch">
        Your tax-deductible gift funds scholarships, cultural festivals, first-responder appreciation,
        and neighborhood programs across Tarzana, Woodland Hills, Reseda, and the Warner Center.
      </p>
      <!-- Diana, Jul 30 2026: the Donate page needs an action button through to
           the Community Benefit Foundation — the 501(c)(3) that receives the
           gifts and runs the programs listed below. -->
      <div class="btn-row mt-4">
        <a class="btn btn--gold" href="community/community-benefit-foundation.html">About the Community Benefit Foundation →</a>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="grid grid-2" id="donateProjects"></div>
    </div>
  </section>

  <div data-partial="footer"></div>

  <script src="js/partials.js?v=20260810a"></script>
  <script src="js/api-base.js?v=20260729b"></script>
  <script src="js/chamber.js?v=20260810a"></script>
  <script>
    ChamberPartials.mount({ active: '', depth: 0, lang: 'en' });
    // Donation projects are office-editable (Admin → Content). Restored from the
    // legacy Community Benefit Foundation donation page (Felicia, Jul 29 2026),
    // which let a donor choose which initiative or event their gift went to.
    const FALLBACK = [
      { key: 'Community Benefit Foundation', blurb: 'Community cleanup supplies and equipment for a cleaner, greener Valley.' },
      { key: 'Grateful Hearts', blurb: 'Honoring and supporting our local LAPD and LAFD first responders.' },
      { key: 'Valley Asian Cultural Festival', blurb: 'Celebrating the Valley’s vibrant Asian and Pacific Islander communities.' },
      { key: 'Education', blurb: 'Youth and adult education programs and scholarships across the West Valley.' },
    ];
    (async () => {
      let projects = FALLBACK;
      try {
        const d = await Chamber.getJSON(ChamberAPI.url('/api/donation-projects'));
        if (d && Array.isArray(d.projects) && d.projects.length) projects = d.projects;
      } catch (e) {}
      // Preset amounts come from the SKU catalog (actual gifts the Chamber receives).
      let cat = null;
      try { cat = await Chamber.getJSON(ChamberAPI.url('/api/skus')); }
      catch (e) { try { cat = await Chamber.getJSON('data/skus.json'); } catch (e2) {} }
      const presets = ((cat && cat.donations) || []).filter((d) => d.amount != null);
      const amounts = presets.length ? presets : [25, 50, 100, 150, 300].map((a) => ({ sku: 'don-' + a, amount: a }));
      const enc = encodeURIComponent;
      const esc = Chamber.esc;
      document.getElementById('donateProjects').innerHTML = projects.map((p) => `
        <article class="card card--hover">
          <div class="card__icon">♥</div>
          <h3>${esc(p.key)}</h3>
          <p>${esc(p.blurb || p.desc || '')}</p>
          <div class="chips mt-4">
            ${amounts.map((a) => `<a class="chip" href="checkout.html?type=donation&sku=${enc(a.sku)}&project=${enc(p.key)}&amount=${a.amount}">$${a.amount}</a>`).join('')}
            <a class="chip" href="checkout.html?type=donation&sku=don-custom&project=${enc(p.key)}">Other</a>
          </div>
          ${/community\s*benefit\s*foundation/i.test(p.key)
            ? '<p class="mt-3" style="margin-bottom:0"><a href="community/community-benefit-foundation.html" style="font-weight:600">About the Foundation →</a></p>'
            : ''}
        </article>`).join('');
    })();
  </script>
</body>
</html>
